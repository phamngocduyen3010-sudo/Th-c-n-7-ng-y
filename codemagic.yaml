workflows:
  ios-unsigned-test:
    name: Build ThucDon7Ngay iOS (.ipa)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Static Compliance Guard
        script: |
          set -euo pipefail
          if [ -d "Sources" ] && grep -rnE '\bas!|\bTODO\b|\bFIXME\b' Sources Tests 2>/dev/null; then
            echo "ERROR: Forbidden as! / TODO / FIXME found."
            exit 1
          fi
      - name: Install XcodeGen & Generate Project
        script: |
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Build Unsigned Test IPA
        script: |
          xcodebuild \
            -project ThucDon7Ngay.xcodeproj \
            -scheme ThucDon7Ngay \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            SWIFT_STRICT_CONCURRENCY=complete \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build
          mkdir -p release/Payload
          cp -R build/Build/Products/Release-iphoneos/ThucDon7Ngay.app release/Payload/
          cd release && zip -r ThucDon7Ngay-Test-Unsigned.ipa Payload
    artifacts:
      - release/ThucDon7Ngay-Test-Unsigned.ipa
