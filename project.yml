name: ThucDon7Ngay
options:
  bundleIdPrefix: vn.thucdon7ngay
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "12.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ThucDon7Ngay:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.thucdon7ngay.app
        INFOPLIST_FILE: Sources/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/CoreC/ThucDonBridging.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/CoreC
        TARGETED_DEVICE_FAMILY: "1"

  ThucDon7NgayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ThucDon7Ngay
